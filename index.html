  background:linear-gradient(105deg,rgba(8,10,15,.95) 30%,rgba(8,10,15,.55) 70%,rgba(8,10,15,.3));
}
.title-inner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:0 7cqw}
.eyebrow{font-family:'Rajdhani',sans-serif;font-size:1.5cqw;letter-spacing:.42em;color:var(--gold);margin:0 0 1.2cqw}
.title-inner h1{margin:0 0 1cqw;font-size:4.2cqw;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.title-inner p{margin:0 0 3.4cqw;font-size:1.5cqw;color:var(--txt-2)}
.menu{display:flex;flex-direction:column;gap:1cqw;width:24cqw}
.menu button{
  height:4.4cqw;border:1px solid var(--line-2);background:rgba(20,25,34,.82);color:var(--txt);
  border-radius:3px;font-size:1.55cqw;font-weight:500;letter-spacing:.04em;
  display:flex;align-items:center;gap:1.1cqw;padding:0 1.6cqw;transition:.14s;text-align:left;
}
.menu button::before{content:'';width:.28cqw;height:1.9cqw;background:var(--line-2);transition:.14s}
.menu button:hover{border-color:var(--gold);background:rgba(38,30,14,.9);transform:translateX(.4cqw)}
.menu button:hover::before{background:var(--gold);height:2.4cqw}
.menu button.primary::before{background:var(--accent)}
.menu .hint{margin-left:auto;font-size:1.1cqw;color:var(--txt-3)}

/* ═══ 2. 설정 ═══ */
.cfg-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.cfg-head h2{margin:0;font-size:19px;font-weight:700}
.crumb{font-size:12px;color:var(--txt-3)}
.cfg-head .sp{flex:1}
.btn{
  height:36px;padding:0 16px;border-radius:3px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--txt-2);font-size:13px;transition:.14s;
}
.btn:hover{background:var(--panel-2);color:var(--txt);border-color:var(--txt-3)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover{background:rgba(217,164,65,.14);color:#f3cd85}
.btn.red{border-color:var(--accent);color:#f18b87}
.btn.red:hover{background:rgba(232,68,63,.16);color:#fff}

.cols{display:grid;grid-template-columns:1.15fr 1fr 1fr 1.05fr;gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.col > .col-h3{
  margin:0;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--txt-2);
  background:var(--panel-2);border-radius:6px;width:100%;border:0;border-bottom:1px solid transparent;
  display:flex;align-items:center;gap:7px;text-align:left;font-family:inherit;transition:.12s;
}
.col > .col-h3:hover{color:var(--txt)}
.col.open > .col-h3{border-radius:6px 6px 0 0;border-bottom-color:var(--line)}
.col > .col-h3 .arw{margin-left:auto;font-size:10px;color:var(--txt-3);transition:transform .16s}
.col.open > .col-h3 .arw{transform:rotate(90deg);color:var(--gold)}
.col > .col-h3 .cnt{font-size:11px;font-weight:400;color:var(--txt-3);letter-spacing:0}
.col .scroll{height:0;overflow:hidden}
.col.open .scroll{height:352px;overflow-y:auto}
.col > .col-h3 .step{
  width:17px;height:17px;border-radius:2px;background:var(--gold);color:#1a1305;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.scroll{
  overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:var(--line-2) transparent;
}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.scroll::-webkit-scrollbar-track{background:transparent}

.row{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 13px;
  background:none;border:0;border-bottom:1px solid rgba(40,49,63,.7);
  color:var(--txt);font-size:13px;text-align:left;transition:.1s;
}
.row:hover{background:var(--panel-2)}
.row[aria-selected="true"]{background:rgba(217,164,65,.13);box-shadow:inset 2px 0 0 var(--gold)}
.row .n{
  width:19px;height:19px;flex:none;border-radius:2px;background:#0e131b;color:var(--txt-2);
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;
}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-size:11.5px;color:var(--txt-3);flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val.set{color:var(--gold)}
.row .sw{width:8px;height:8px;border-radius:2px;flex:none}
.row .chev{color:var(--txt-3);font-size:11px}
.empty{padding:16px 14px;font-size:12px;color:var(--txt-3);line-height:1.7}

/* 미리보기 */
.prev{padding:13px}
.prev .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pcell{
  aspect-ratio:1.45;border:1px solid var(--line);border-radius:3px;background:#0e131b;position:relative;
  display:flex;align-items:center;justify-content:center;padding:3px;
  font-size:10px;line-height:1.2;text-align:center;color:var(--txt-3);
}
.pcell .k{position:absolute;left:3px;top:2px;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;color:var(--txt-3)}
.pcell.res{border-style:dashed;border-color:var(--line-2)}
.prev p{margin:11px 0 0;font-size:11.5px;color:var(--txt-3);line-height:1.7}

/* ═══ 3. 인게임 ═══ */
.hud{
  position:absolute;left:1.4cqw;top:1.4cqw;z-index:5;display:flex;gap:.6cqw;align-items:center;
  background:rgba(8,11,17,.82);border:1px solid rgba(90,105,130,.5);border-radius:3px;padding:.55cqw .8cqw;
  backdrop-filter:blur(3px);
}
.hud button{
  height:2.2cqw;padding:0 .85cqw;border-radius:2px;border:1px solid var(--line-2);
  background:rgba(27,34,48,.85);color:var(--txt-2);font-size:1.02cqw;
}
.hud button:hover{color:#fff;border-color:var(--txt-3)}
.sw-toggle{display:flex;align-items:center;gap:.5cqw;font-size:1.02cqw;color:var(--txt-2);padding-right:.5cqw}
.sw-toggle b{color:var(--cyan);font-weight:500}
.sw-toggle b.off{color:var(--txt-3)}
.track{
  width:2.6cqw;height:1.3cqw;border-radius:1cqw;background:#2a3242;position:relative;transition:.16s;flex:none;border:0;padding:0;
}
.track::after{content:'';position:absolute;top:.16cqw;left:.16cqw;width:.98cqw;height:.98cqw;border-radius:50%;background:#7b8699;transition:.16s}
.track.on{background:rgba(89,200,232,.35)}
.track.on::after{left:1.46cqw;background:var(--cyan)}

/* 상자 */
.chest{
  position:absolute;left:50.5%;top:16%;width:25cqw;z-index:4;
  opacity:0;visibility:hidden;transform:translateY(.6cqw) scale(.985);
  transition:opacity .22s ease-out, transform .22s ease-out, visibility 0s .22s;
  background:linear-gradient(180deg,rgba(28,34,45,.94),rgba(16,20,28,.94));
  border:1px solid rgba(120,135,160,.42);border-radius:.5cqw;
  box-shadow:0 1cqw 3cqw rgba(0,0,0,.6);backdrop-filter:blur(2px);
}
.chest.in{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease-out, transform .22s ease-out, visibility 0s}
.chest-hd{display:flex;align-items:center;gap:.6cqw;padding:.75cqw .95cqw}
.chest-hd .bar{width:.22cqw;height:1.5cqw;background:var(--cyan)}
.chest-hd h4{margin:0;font-size:1.35cqw;font-weight:700;letter-spacing:.03em}
.chest-hd .loot{
  margin-left:auto;width:2.1cqw;height:2.1cqw;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#f3d180,#b07c1c);
  border:1px solid rgba(255,235,180,.5);
}
.chest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4cqw;padding:0 .95cqw .95cqw}
.lootcell{
  aspect-ratio:1.06;border-radius:.25cqw;border:1px solid rgba(120,135,160,.3);
  background:#2c3442;position:relative;padding:.25cqw .15cqw;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12cqw;
  text-align:center;line-height:1.15;color:#eef2f8;font-family:inherit;transition:.1s;
}
.lootcell .cat{font-size:.68cqw;color:rgba(255,255,255,.72);letter-spacing:-.01em}
.lootcell .nm{font-size:.92cqw;font-weight:500}
.lootcell.has{cursor:pointer}
.lootcell.has:hover{filter:brightness(1.3);border-color:rgba(255,255,255,.65)}
.lootcell.has:active{transform:scale(.95)}
.lootcell .q{
  position:absolute;right:.22cqw;bottom:.1cqw;font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:1.15cqw;color:#fff;text-shadow:0 1px 3px #000;
}
.lootcell.empty-cell{background:#242b36;border-style:dashed;border-color:rgba(120,135,160,.2)}
.chest-ft{
  display:flex;align-items:center;gap:.5cqw;padding:.55cqw .95cqw;border-top:1px solid rgba(120,135,160,.22);
  font-size:.95cqw;color:var(--txt-3);
}
.chest-ft button{
  margin-left:auto;height:1.9cqw;padding:0 .8cqw;border-radius:2px;font-size:.95cqw;
  border:1px solid var(--line-2);background:rgba(27,34,48,.9);color:var(--txt-2);
}
.chest-ft button:hover{color:#fff}

/* 로그 */
.tray{position:absolute;left:50.5%;top:calc(16% + 1cqw);transform:translateY(0);z-index:4;width:25cqw;pointer-events:none}
.toast{
  margin-top:.4cqw;padding:.45cqw .7cqw;border-radius:.25cqw;font-size:.95cqw;line-height:1.45;
  background:rgba(8,11,17,.9);border-left:.2cqw solid var(--line-2);color:#cfd7e4;
  animation:slide .25s ease-out;
}
@keyframes slide{from{opacity:0;transform:translateX(-.6cqw)}to{opacity:1;transform:none}}
.toast.t-assign{border-color:#6bcf7a}
.toast.t-stack{border-color:var(--cyan)}
.toast.t-reserve{border-color:var(--gold)}
.toast.t-front{border-color:var(--accent)}
.toast b{font-weight:700;color:#fff}

/* 인벤토리 오버레이 — 스크린샷 좌표 기준 */
.inv-ov{position:absolute;left:56.77%;top:90.46%;width:18.54%;z-index:3}
.inv-ov::before{content:'';position:absolute;left:-.25cqw;top:-.25cqw;
  width:calc(4 * 3.724cqw + 3.646cqw + .5cqw);height:calc(2.734cqw + 2.344cqw + .5cqw);
  background:#0a0d12;border-radius:.2cqw}
.ivcell{
  position:absolute;width:3.646cqw;height:2.344cqw;border-radius:.12cqw;
  border:1px solid rgba(0,0,0,.85);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:.15cqw;
  font-size:.56cqw;line-height:1.1;font-weight:400;color:rgba(255,255,255,.9);letter-spacing:-.02em;
  text-shadow:0 1px 2px rgba(0,0,0,.9);overflow:hidden;
}
.ivcell .k{
  position:absolute;left:0;bottom:0;width:1cqw;height:1cqw;background:rgba(8,10,14,.92);
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.82cqw;color:#e8edf5;
  display:flex;align-items:center;justify-content:center;
}
.ivcell .q{
  position:absolute;right:.15cqw;bottom:-.05cqw;font-family:'Rajdhani',sans-serif;font-weight:700;
  font-size:1.05cqw;color:#fff;text-shadow:0 1px 3px #000;
}
.ivcell .pin{position:absolute;right:.1cqw;top:.02cqw;font-size:.42cqw;color:rgba(255,255,255,.6)}
.ivcell.void{background:#11151c}
.ivcell .ghost,.ivcell.ghost{color:rgba(190,200,215,.45);font-weight:400;font-size:.5cqw}
.ivcell.res{border-style:dashed;border-color:rgba(217,164,65,.7)}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(89,200,232,.95),inset 0 0 0 1px rgba(255,255,255,.14)}
100%{box-shadow:0 0 0 .8cqw rgba(89,200,232,0),inset 0 0 0 1px rgba(255,255,255,.14)}}
.ivcell.hit{animation:flash .55s ease-out}

.note{margin-top:12px;font-size:12px;color:var(--txt-3);text-align:center}
@media (max-width:820px){ .cols{grid-template-columns:1fr} .col.open .scroll{height:240px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ═══════ 1. 타이틀 ═══════ -->
<section class="screen on" id="title">
  <div class="stage shot">
    <div class="title-inner">
      <p class="eyebrow">ETERNAL RETURN · PATCH 12.1</p>
      <h1>인벤토리 지정 배치<br>프로토타입</h1>
      <p>슬롯마다 담길 아이템을 미리 지정하고, 획득 시 그 자리로 정렬되는지 검증합니다.</p>
      <div class="menu">
        <button class="primary" data-go="game">시작<span class="hint">현재 설정으로 바로</span></button>
        <button data-go="config">인벤토리 설정<span class="hint">슬롯 지정</span></button>
      </div>
    </div>
  </div>
</section>

<!-- ═══════ 2. 설정 ═══════ -->
<section class="screen" id="config">
  <div class="cfg-head">
    <div>
      <p class="crumb" style="margin:0 0 2px">설정 › 게임 › 인벤토리 슬롯 지정</p>
      <h2>인벤토리 슬롯 지정</h2>
    </div>
    <div class="sp"></div>
    <button class="btn" data-go="title">처음으로</button>
    <button class="btn" id="btnPreset">예시 세팅</button>
    <button class="btn" id="btnClear">전체 해제</button>
    <button class="btn gold" id="btnSave">저장</button>
    <button class="btn red" data-go="game">시작</button>
  </div>

  <div class="cols">
    <div class="col open" id="boxSlot">
      <button class="col-h3"><span class="step">1</span>인벤토리 슬롯<span class="cnt" id="cntSlot"></span><span class="arw">▶</span></button>
      <div class="scroll" id="colSlot"></div>
    </div>
    <div class="col" id="boxMajor">
      <button class="col-h3"><span class="step">2</span>대분류<span class="cnt" id="cntMajor"></span><span class="arw">▶</span></button>
      <div class="scroll" id="colMajor"></div>
    </div>
    <div class="col" id="boxMinor">
      <button class="col-h3"><span class="step">3</span>소분류<span class="cnt" id="cntMinor"></span><span class="arw">▶</span></button>
      <div class="scroll" id="colMinor"></div>
    </div>
    <div class="col open">
      <button class="col-h3">미리보기<span class="arw">▶</span></button>
      <div class="scroll prev">
        <div class="grid" id="prevGrid"></div>
        <p id="prevNote"></p>
      </div>
    </div>
  </div>
  <p class="note">슬롯 → 대분류 → 소분류 순으로 지정합니다. 소분류를 비우면 대분류 전체를 받습니다.</p>
</section>

<!-- ═══════ 3. 인게임 ═══════ -->
<section class="screen" id="game">
  <div class="stage shot">
    <div class="hud">
      <span class="sw-toggle">지정 배치 <b id="swLabel">ON</b></span>
      <button class="track on" id="swTrack" aria-label="지정 배치 켜기/끄기"></button>
      <button data-go="config">설정</button>
      <button id="btnEmpty">인벤 비우기</button>
      <button data-go="title">나가기</button>
    </div>

    <div class="chest" id="chest">
      <div class="chest-hd"><span class="bar"></span><h4>상자</h4><span class="loot"></span></div>
      <div class="chest-grid" id="chestGrid"></div>
      <div class="chest-ft"><span>아이템을 클릭해 획득</span><button id="btnRefill">상자 새로 채우기</button></div>
    </div>

    <div class="tray" id="tray" style="top:auto;bottom:14%"></div>

    <div class="inv-ov" id="invOv"></div>
  </div>
  <p class="note">우측 하단 인벤토리는 실제 인게임 좌표(1090, 977 / 5×2)에 맞춰 배치했습니다.</p>
</section>

<script>
/* ─────────── 데이터 ─────────── */
const CATS = {
  food:   {name:'음식·음료',   key:'food',   color:'var(--c-food)',   bd:'var(--c-food-b)',   stack:6,
           minors:['회복 음식','버프 음식','음료']},
  use:    {name:'사용 아이템', key:'use',    color:'var(--c-use)',    bd:'var(--c-use-b)',    stack:6,
           minors:['정찰 드론','EMP 드론','망원 카메라','위장 카메라','전환 아이템','설치 아이템']},
  weapon: {name:'무기',        key:'weapon', color:'var(--c-weapon)', bd:'var(--c-weapon-b)', stack:1,
           minors:['단검','양손검','도끼','망치','투척','활','석궁','권총','돌격소총','저격총','레이피어','창','쌍절곤','톤파','채찍','기타','아르카나','VF의수','글러브','카메라','배트','암기']},
  armor:  {name:'방어구',      key:'armor',  color:'var(--c-armor)',  bd:'var(--c-armor-b)',  stack:1,
           minors:['옷','머리','팔','다리']},
  mat:    {name:'재료',        key:'mat',    color:'var(--c-mat)',    bd:'var(--c-mat-b)',    stack:2,
           minors:['일반 재료','고급 재료','희귀 재료','영웅 재료']}
};
const RESERVE = {name:'예비 슬롯'}, NONE = {name:'해당 없음'};

const ITEMS = [
  {id:'toast',  n:'토스트',      c:'food',   m:'회복 음식'},
  {id:'bread',  n:'눈물 젖은 빵', c:'food',   m:'회복 음식'},
  {id:'melon',  n:'수박',        c:'food',   m:'회복 음식'},
  {id:'stew',   n:'해물 스튜',    c:'food',   m:'버프 음식'},
  {id:'capsule',n:'캡슐',        c:'food',   m:'버프 음식'},
  {id:'holy',   n:'성수',        c:'food',   m:'버프 음식'},

  {id:'scout',  n:'정찰 드론',    c:'use',    m:'정찰 드론'},
  {id:'emp',    n:'EMP 드론',    c:'use',    m:'EMP 드론'},
  {id:'tele',   n:'망원 카메라',  c:'use',    m:'망원 카메라'},
  {id:'cctv',   n:'위장 카메라',  c:'use',    m:'위장 카메라'},
  {id:'aglaia', n:'아글라이아의 선물', c:'use', m:'전환 아이템'},
  {id:'gen',    n:'휴대용 생성기', c:'use',   m:'전환 아이템'},

  {id:'eagle',  n:'데저트 이글',  c:'weapon', m:'권총'},
  {id:'spear',  n:'장창',        c:'weapon', m:'창'},
  {id:'polar',  n:'폴라로이드',   c:'weapon', m:'카메라'},

  {id:'plate',  n:'성기사의 갑옷', c:'armor', m:'옷'},
  {id:'cap',    n:'캡틴 햇',      c:'armor', m:'머리'},
  {id:'fan',    n:'백우선',       c:'armor', m:'팔'},
  {id:'boots',  n:'등산화',       c:'armor', m:'다리'},

  {id:'scis',   n:'가위',        c:'mat',    m:'일반 재료'},
  {id:'chip',   n:'전자 부품',    c:'mat',    m:'고급 재료'},
  {id:'motor',  n:'모터',        c:'mat',    m:'희귀 재료'},
  {id:'meteor', n:'운석',        c:'mat',    m:'영웅 재료'}
];
const KEYS = ['1','2','3','4','5','6','7','8','9','0'];
const it = id => ITEMS.find(x => x.id === id);
const $ = s => document.querySelector(s);

/* ─────────── 상태 ─────────── */
let assign = Array(10).fill(null);   // null | {c,m} | {c:'reserve'}
let slots  = Array(10).fill(null);   // {id,qty}
let chest  = [];
let sel = 0, useAssign = true, logs = [];

const PRESET = () => [
  {c:'food', m:'회복 음식'}, {c:'food', m:'버프 음식'},
  {c:'use',  m:'정찰 드론'}, {c:'use',  m:'EMP 드론'}, {c:'use', m:'망원 카메라'},
  {c:'weapon', m:null}, {c:'armor', m:null}, {c:'mat', m:null},
  {c:'reserve'}, null
];

/* ─────────── 배치 로직 ─────────── */
const hit = (a, x) => a && a.c !== 'reserve' && a.c === x.c && (!a.m || a.m === x.m);
const isRes = a => a && a.c === 'reserve';

function place(x){
  const lim = CATS[x.c].stack;
  if(useAssign){
    for(let i=0;i<10;i++) if(hit(assign[i],x) && slots[i] && slots[i].id===x.id && slots[i].qty<lim){
      slots[i].qty++; return {i, r:'stack', t:`<b>${x.n}</b> → ${KEYS[i]}번 지정 슬롯에 합침 (${slots[i].qty}/${lim})`}; }
    for(let i=0;i<10;i++) if(hit(assign[i],x) && !slots[i]){
      slots[i]={id:x.id,qty:1}; return {i, r:'assign', t:`<b>${x.n}</b> → ${KEYS[i]}번 지정 슬롯에 배치`}; }
    for(let i=0;i<10;i++) if(isRes(assign[i]) && slots[i] && slots[i].id===x.id && slots[i].qty<lim){
      slots[i].qty++; return {i, r:'reserve', t:`지정 슬롯 포화 → ${KEYS[i]}번 예비 슬롯에 합침 (${slots[i].qty}/${lim})`}; }
    for(let i=0;i<10;i++) if(isRes(assign[i]) && !slots[i]){
      slots[i]={id:x.id,qty:1}; return {i, r:'reserve', t:`지정 슬롯 포화 → <b>${x.n}</b>을(를) ${KEYS[i]}번 예비 슬롯으로`}; }
  }
  for(let i=0;i<10;i++) if(slots[i] && slots[i].id===x.id && slots[i].qty<lim){
    slots[i].qty++; return {i, r:'front', t:`기존 규칙 → ${KEYS[i]}번에 합침 (${slots[i].qty}/${lim})`}; }
  for(let i=0;i<10;i++) if(!slots[i]){
    slots[i]={id:x.id,qty:1};
    const why = !useAssign ? '지정 배치 OFF' : (assign.some(a=>hit(a,x)) ? '지정·예비 모두 포화' : '지정 없음');
    return {i, r:'front', t:`${why} → 앞 번호 ${KEYS[i]}번에 배치`}; }
  return {i:-1, r:'front', t:`인벤토리가 가득 차 <b>${x.n}</b>을(를) 획득할 수 없음`};
}

/* ─────────── 설정 화면 ─────────── */
function labelOf(a){
  if(!a) return NONE.name;
  if(a.c === 'reserve') return RESERVE.name;
  return CATS[a.c].name + (a.m ? ' › ' + a.m : '');
}
function colorOf(a){
  if(!a || a.c === 'reserve') return 'var(--line-2)';
  return CATS[a.c].color;
}

function drawSlots(){
  $('#colSlot').innerHTML = KEYS.map((k,i)=>{
    const a = assign[i];
    return `<button class="row" role="option" aria-selected="${i===sel}" data-slot="${i}">
      <span class="n">${k}</span><span class="lbl">인벤토리 슬롯 ${k}</span>
      <span class="sw" style="background:${a?colorOf(a):'transparent'}"></span>
      <span class="val ${a?'set':''}">${a?labelOf(a):'—'}</span></button>`;
  }).join('');
}
function drawMajor(){
  const cur = assign[sel];
  const cell = (val,name,color,extra='') =>
    `<button class="row" role="option" aria-selected="${
      (val===''&&!cur) || (cur&&cur.c===val) ? 'true':'false'}" data-major="${val}">
      <span class="sw" style="background:${color}"></span><span class="lbl">${name}</span>
      <span class="chev">${extra}</span></button>`;
  $('#colMajor').innerHTML =
    Object.values(CATS).map(c => cell(c.key, c.name, c.color, '›')).join('') +
    cell('reserve', RESERVE.name, 'var(--line-2)') +
    cell('', NONE.name, 'transparent');
}
function drawMinor(){
  const cur = assign[sel], box = $('#colMinor');
  if(!cur || cur.c === 'reserve'){
    box.innerHTML = `<p class="empty">${cur ? '예비 슬롯은 소분류를 지정하지 않습니다.' : '대분류를 먼저 선택하세요.'}</p>`;
    return;
  }
  box.innerHTML =
    `<button class="row" role="option" aria-selected="${!cur.m}" data-minor="">
      <span class="lbl">전체</span><span class="val">${CATS[cur.c].name} 전부</span></button>` +
    CATS[cur.c].minors.map(m =>
      `<button class="row" role="option" aria-selected="${cur.m===m}" data-minor="${m}">
        <span class="sw" style="background:${CATS[cur.c].color}"></span><span class="lbl">${m}</span></button>`).join('');
}
function drawPreview(){
  $('#prevGrid').innerHTML = KEYS.map((k,i)=>{
    const a = assign[i];
    if(!a) return `<div class="pcell"><span class="k">${k}</span></div>`;
    if(a.c === 'reserve') return `<div class="pcell res"><span class="k">${k}</span>예비</div>`;
    return `<div class="pcell" style="background:${CATS[a.c].color};border-color:${CATS[a.c].bd};color:#fff">
      <span class="k">${k}</span>${a.m || CATS[a.c].name}</div>`;
  }).join('');
  const n = assign.filter(Boolean).length, r = assign.filter(isRes).length;
  $('#prevNote').innerHTML = `지정 ${n - r}칸 · 예비 ${r}칸 · 미지정 ${10 - n}칸<br>
    미지정 슬롯은 현행 규칙(앞 번호 빈 칸)을 그대로 따릅니다.`;
}
function drawHeads(){
  const a = assign[sel];
  $('#cntSlot').textContent  = `${KEYS[sel]}번 선택`;
  $('#cntMajor').textContent = a ? (a.c==='reserve'?RESERVE.name:CATS[a.c].name) : NONE.name;
  $('#cntMinor').textContent = (a && a.c!=='reserve') ? (a.m || '전체') : '—';
}
function expand(id, on){ document.getElementById(id).classList.toggle('open', on); }
const drawConfig = () => { drawSlots(); drawMajor(); drawMinor(); drawPreview(); drawHeads(); };

document.querySelectorAll('.col-h3').forEach(h =>
  h.addEventListener('click', () => h.parentElement.classList.toggle('open')));

$('#colSlot').addEventListener('click', e=>{
  const b = e.target.closest('[data-slot]'); if(!b) return;
  sel = +b.dataset.slot; drawConfig(); expand('boxMajor', true);
});
$('#colMajor').addEventListener('click', e=>{
  const b = e.target.closest('[data-major]'); if(!b) return;
  const v = b.dataset.major;
  assign[sel] = v === '' ? null : (v === 'reserve' ? {c:'reserve'} : {c:v, m:null});
  drawConfig();
  expand('boxMinor', !!(assign[sel] && assign[sel].c !== 'reserve'));
});
$('#colMinor').addEventListener('click', e=>{
  const b = e.target.closest('[data-minor]'); if(!b) return;
  if(assign[sel] && assign[sel].c !== 'reserve') assign[sel].m = b.dataset.minor || null;
  drawConfig();
});
$('#btnPreset').addEventListener('click', ()=>{ assign = PRESET(); drawConfig(); });
$('#btnClear').addEventListener('click',  ()=>{ assign = Array(10).fill(null); drawConfig(); });
$('#btnSave').addEventListener('click', e=>{
  const b = e.currentTarget, o = b.textContent;
  b.textContent = '저장됨'; setTimeout(()=> b.textContent = o, 1100);
});

/* ─────────── 인게임 ─────────── */
const CW = 3.724, RH = 2.734;   // 스크린샷 실측 좌표(%/cqw)

function drawInv(flash){
  $('#invOv').innerHTML = KEYS.map((k,i)=>{
    const s = slots[i], a = assign[i], col = i % 5, row = (i / 5) | 0;
    const pos = `left:${col * CW}cqw;top:${row * RH}cqw`;
    let cls = 'ivcell', style = pos, body = '';
    if(s){
      const x = it(s.id), c = CATS[x.c];
      style += `;background:${c.color};border-color:rgba(0,0,0,.9)`;
      body = `<span>${x.n}</span>` + (c.stack > 1 ? `<span class="q">${s.qty}</span>` : '');
      if(useAssign && hit(a, x)) body += `<span class="pin">●</span>`;
    }else if(useAssign && isRes(a)){
      cls += ' void res'; body = `<span class="ghost" style="color:rgba(217,164,65,.8)">예비</span>`;
    }else if(useAssign && a){
      cls += ' void'; body = `<span class="ghost">${a.m || CATS[a.c].name}</span>`;
    }else{
      cls += ' void';
    }
    if(i === flash) cls += ' hit';
    return `<div class="${cls}" style="${style}"><span class="k">${k}</span>${body}</div>`;
  }).join('');
}

function refill(){
  const pool = [...ITEMS].sort(()=> Math.random() - .5).slice(0, 10);
  chest = pool.map(x => ({id:x.id, q: CATS[x.c].stack > 1 ? 1 + ((Math.random()*3)|0) : 1}));
  drawChest();
}
function drawChest(){
  const cells = [];
  for(let i=0;i<12;i++){
    const s = chest[i];
    if(!s || s.q <= 0){ cells.push(`<div class="lootcell empty-cell"></div>`); continue; }
    const x = it(s.id), c = CATS[x.c];
    cells.push(`<button class="lootcell has" data-loot="${i}"
      style="background:${c.color};border-color:${c.bd}">
      <span class="cat">${c.name}${x.m && x.m !== c.name ? ' · ' + x.m : ''}</span>
      <span class="nm">${x.n}</span>${c.stack > 1 ? `<span class="q">${s.q}</span>` : ''}</button>`);
  }
  $('#chestGrid').innerHTML = cells.join('');
}
function drawTray(){
  $('#tray').innerHTML = logs.slice(0,4).map(l => `<div class="toast t-${l.r}">${l.t}</div>`).join('');
}

$('#chestGrid').addEventListener('click', e=>{
  const b = e.target.closest('[data-loot]'); if(!b) return;
  const s = chest[+b.dataset.loot]; if(!s || s.q <= 0) return;
  const r = place(it(s.id));
  if(r.i >= 0) s.q--;
  logs.unshift(r); logs = logs.slice(0,4);
  drawChest(); drawInv(r.i); drawTray();
});
$('#btnRefill').addEventListener('click', refill);
$('#btnEmpty').addEventListener('click', ()=>{ slots = Array(10).fill(null); logs = []; drawInv(); drawTray(); });
$('#swTrack').addEventListener('click', ()=>{
  useAssign = !useAssign;
  $('#swTrack').classList.toggle('on', useAssign);
  $('#swLabel').textContent = useAssign ? 'ON' : 'OFF';
  $('#swLabel').classList.toggle('off', !useAssign);
  drawInv();
});

/* ─────────── 화면 전환 ─────────── */
let chestTimer = null;
function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  clearTimeout(chestTimer);
  $('#chest').classList.remove('in');
  if(id === 'config') drawConfig();
  if(id === 'game'){
    drawInv(); drawChest(); drawTray();
    chestTimer = setTimeout(() => $('#chest').classList.add('in'), 500);
  }
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go]'); if(b) go(b.dataset.go);
});

assign = PRESET();
refill();
drawConfig();
</script>
</body>
</html>
